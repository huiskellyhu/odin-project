<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="calculator.js" defer></script>
  </head>
  <body>
    <div class="header">
        <h1> Calculator </h1>
    </div>
    <div class="calc-body">
        <div class="display" id="result">
            0
        </div>
        <div class="input-board">
            <div id="numbers">
                <div class="numbers-row">
                    <button id="numOne" data-number="1"> 1 </button>
                    <button id="numTwo" data-number="2"> 2 </button>
                    <button id="numThree" data-number="3"> 3 </button>
                </div>
                <div class="numbers-row">
                    <button id="numFour" data-number="4"> 4 </button>
                    <button id="numFive" data-number="5"> 5 </button>
                    <button id="numSix" data-number="6"> 6 </button>
                </div>
                <div class="numbers-row">
                    <button id="numSeven" data-number="7"> 7 </button>
                    <button id="numEight" data-number="8"> 8 </button>
                    <button id="numNine" data-number="9"> 9 </button>
                </div>
                <div class="numbesr-row">
                    <button id="numZero" data-number="0"> 0 </button>
                </div>
            </div>
            <div id="operators">
                <button id="add"> + </button>
                <button id="subtract"> - </button>
                <button id="multiply"> x </button>
                <button id="divide"> / </button>
                <button id="equals"> = </button>
                <button id="clear"> C/E </button>
            </div>
        </div>
    </div>
    <!-- <div class="user-input">
        <form id="add-items" method="POST">
            <label for="new-item">Enter a new item: </label>
            <input type="text" id="item" name="item">
            <button id="add"> Add </button>
        </form>
    </div> -->
  </body>
</html>
